<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>watchpoint</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%232f6fdb' stroke-width='4'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%232f6fdb'/%3E%3C/svg%3E">
<style>
/*__WATCHPOINT_CSS__*/
</style>
</head>
<body>
<header class="top">
  <h1>watchpoint</h1>
  <nav class="tabs" role="tablist" aria-label="表示">
    <button role="tab" id="tab-targets" data-tab="targets" aria-selected="true" aria-controls="view-targets">見張り</button>
    <button role="tab" id="tab-config" data-tab="config" aria-selected="false" aria-controls="view-config" tabindex="-1">設定</button>
    <button role="tab" id="tab-log" data-tab="log" aria-selected="false" aria-controls="view-log" tabindex="-1">ログ</button>
  </nav>
  <span id="counts"></span>
  <span class="spacer"></span>
  <span id="progress" aria-live="polite"></span>
  <label class="toggle" title="この画面を開いている間、各見張りをそれぞれのチェックの間隔（既定 30 分）でチェックし、新しい変更を通知する">
    <input type="checkbox" id="auto"> 開いている間、自動でチェック</label>
  <button id="copy-ai" title="未確認の変更と取得失敗を、Copilot などの AI に貼れる形でコピーする（check -f md -C と同じ）">AI 用にコピー</button>
  <button id="check-due" class="check" title="チェックの間隔が過ぎた見張りだけをチェックする">時間が来たものだけ</button>
  <button id="check-all" class="check primary">すべてチェック</button>
</header>

<main id="view-targets" class="view" role="tabpanel" aria-labelledby="tab-targets">
  <aside id="side">
    <div id="filters">
      <button id="add-target" title="ファイルの中を見ながら、見張りを追加する">＋ 見張りを追加</button>
      <input id="search" type="search" placeholder="名前で絞り込む（/）" aria-label="名前で絞り込む">
      <div id="tags"></div>
      <label title="未確認の変更・取得失敗・要注意のある見張りだけ"><input type="checkbox" id="pending-only"> 見ておきたいものだけ</label>
      <button id="ack-shown" hidden></button>
      <div id="selbar" role="region" aria-label="選んだ見張りの操作" hidden></div>
    </div>
    <ul id="list" aria-label="見張り"></ul>
    <div class="keys"><span><kbd>j</kbd><kbd>k</kbd> 移動</span><span><kbd>x</kbd> 選ぶ</span><span><kbd>c</kbd> チェック</span><span><kbd>a</kbd> 確認済みに</span><span><kbd>f</kbd> 全画面</span><span><kbd>/</kbd> 絞り込み</span><span><kbd>Esc</kbd> 選択を解除</span></div>
  </aside>
  <section id="detail"><p class="empty">左の一覧から選んでください。</p></section>
</main>

<main id="view-config" class="view" role="tabpanel" aria-labelledby="tab-config" hidden>
  <section id="configview">
    <div class="actions" style="margin:0">
      <strong>設定ファイル</strong><code id="config-path" class="sub" style="margin:0"></code>
      <span class="spacer"></span><span id="config-state" class="sub" style="margin:0"></span>
    </div>
    <textarea id="config-text" spellcheck="false" aria-label="設定ファイルの中身"></textarea>
    <div class="actions" style="margin:0">
      <button id="config-add" title="画面で選んで見張りを追加する（編集欄に書き足すだけ。保存は「保存」で）">見張りを追加</button>
      <button id="config-validate">誤りを調べる</button>
      <select id="config-target" aria-label="試す見張り"></select>
      <button id="config-try" title="保存する前の内容のまま、その見張りを取ってきてテキストにする">保存前の内容で試す</button>
      <span class="spacer"></span>
      <button id="config-reload">ファイルから読み直す</button>
      <button id="config-save" class="primary" title="Ctrl+S">保存</button>
    </div>
    <div id="config-result"></div>
    <div id="allowed"></div>
    <p class="sub">誤りのある内容は保存できません。保存すると前の内容を <code>.bak</code> に残す。include で取り込んだファイルは、ここでは直せない。</p>
  </section>
</main>

<main id="view-log" class="view" role="tabpanel" aria-labelledby="tab-log" hidden>
  <section id="logview"></section>
</main>

<dialog id="dialog">
  <div class="head"><strong id="dialog-title"></strong><span class="spacer"></span>
    <span id="dialog-actions"></span><button id="dialog-copy" class="mini" hidden>コピー</button><button id="dialog-close">閉じる</button></div>
  <div class="body" id="dialog-body"></div>
</dialog>
<div id="toast" role="status"></div>

<script>
//__WATCHPOINT_JS__
</script>
</body>
</html>
